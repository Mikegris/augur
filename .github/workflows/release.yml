name: Build & Release DMG

# Builds the macOS .app bundle and publishes a GitHub Release with the DMG
# attached. This is what makes the desktop app's startup update-check work:
# desktop.py polls /releases/latest, so a new version only reaches existing
# desktop users once a Release with a higher tag is published here.
#
# Trigger by pushing a version tag:   git tag v2.7.0 && git push origin v2.7.0
# Or run manually from the Actions tab (workflow_dispatch) with a version.
#
# The bundle is UNSIGNED (no Apple Developer ID secrets) — Gatekeeper flags it
# on other Macs; users right-click → Open once to bypass. Add a codesign +
# notarytool step here later if you obtain a Developer ID.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 2.7.0 (no leading v)'
        required: true

permissions:
  contents: write   # create the Release + upload the DMG asset

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) — matches the dev machine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'   # matches local env + the py2app<0.28 pin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build .app bundle
        env:
          AUGUR_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: python setup_app.py py2app

      - name: Build DMG
        run: bash build_dmg.sh

      - name: Name the DMG with the version
        id: dmg
        run: |
          OUT="dist/AUGUR-${{ steps.ver.outputs.version }}.dmg"
          mv dist/AUGUR.dmg "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AUGUR ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.path }}
          body: |
            Automated build of AUGUR ${{ steps.ver.outputs.tag }}.

            **Install:** download the `.dmg`, open it, drag **AUGUR.app** to
            Applications. The bundle is unsigned — on first launch, right-click
            the app → **Open** to bypass Gatekeeper (one time only).
